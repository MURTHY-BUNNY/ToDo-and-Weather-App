<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow To-Do</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:,"><script src="script.js" defer></script></head><body><main class="wrap"><section class="card"><header><div><p class="eyebrow">YOUR DAILY WORKSPACE</p><h1>TaskFlow<span>.</span></h1><p class="muted">Make space for what matters.</p></div><span id="today" class="pill"></span></header><form id="taskForm"><input id="taskInput" maxlength="120" placeholder="What needs to get done?" required aria-label="New task"><button id="submitBtn">Add task</button></form><nav class="toolbar"><div class="filters"><button type="button" class="filter active" data-filter="all">All</button><button type="button" class="filter" data-filter="pending">Pending</button><button type="button" class="filter" data-filter="completed">Completed</button></div><small id="count">0 tasks</small></nav><ul id="taskList"></ul><div id="empty" class="empty"><b>✓</b><h2>Nothing on your list yet</h2><p>Add a task above and take the first step.</p></div><footer><span id="progress">0 completed</span><button type="button" id="clearBtn" class="link">Clear completed</button></footer></section><p class="note">Your tasks are saved in this browser automatically.</p></main></body></html>
